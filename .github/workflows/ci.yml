name: Local checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:auth --workspace @vibeestimate/frontend
      - run: npm run build
      - run: npm run test:local
      - run: npm run check:public
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: playwright-report/
          retention-days: 3

  # A push to main applies Terraform, so every root is checked before merge.
  # These checks are offline: no backend, no state, no cloud credential.
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node infra/scripts/install-terraform.mjs
      - run: node --test infra/runtime/tests/release.test.mjs
      - run: npm run check:infra
