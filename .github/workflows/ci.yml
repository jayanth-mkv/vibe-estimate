name: Local checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      browser_scope:
        description: Browser verification scope
        type: choice
        required: true
        default: full
        options:
          - full
          - shared-agreement
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run setup
      - run: npm run typecheck
      - run: npm run typecheck:v1
      - run: npm test
      - run: npm run test --workspace @vibeestimate/frontend
      - run: npm run test:spatial
      - run: npm run test:v1:scene
      - run: npm run test:v1:config
      - run: node --test tests/v1/runtime-command.test.mjs
      - run: npm run lint --workspace @vibeestimate/frontend
      - run: npm run build
      - if: github.event_name != 'workflow_dispatch' || inputs.browser_scope != 'shared-agreement'
        run: xvfb-run -a npm run test:v1:browser -- --legacy
      - if: github.event_name == 'workflow_dispatch' && inputs.browser_scope == 'shared-agreement'
        run: xvfb-run -a npm run test:v1:browser -- --grep 'Flow 6'
      - run: npm run check:public
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fixture-browser-failure-report
          path: |
            .cache/v1/*/report/
            .cache/v1/*/evidence/
            .cache/v1/*/browser.json
            .cache/v1/*/verification.json
            .cache/v1/*/ready.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3

  # A push to main applies Terraform, so every root is checked before merge.
  # These checks are offline: no backend, no state, no cloud credential.
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node infra/scripts/install-terraform.mjs
      - run: node --test infra/runtime/tests/release.test.mjs
      - run: npm run check:infra
